<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Little Letters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf8f3;
    --ink: #3d3a4b;
    --muted: #7a7589;
    --tile-border: #ddd6e3;
    --tile-filled: #9b93a8;
    --correct: #4f9473;
    --present: #cc7a3a;
    --absent: #8e8a9c;
    --key: #ebe5f0;
    --key-ink: #3d3a4b;
    --card: #ffffff;
    --pink: #f6c1d0;
    --blue: #bcd9f2;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Fredoka", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  header {
    width: 100%;
    text-align: center;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--tile-border);
  }
  header h1 { margin: 0; font-size: 1.9rem; font-weight: 700; letter-spacing: 0.02em; }
  header h1 span { color: var(--present); }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 0.95rem; }

  main {
    flex: 1;
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 12px 8px;
  }

  #board {
    display: grid;
    grid-template-rows: repeat(6, 1fr);
    gap: 6px;
    width: min(330px, 86vw);
    margin: 8px auto;
  }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .row.shake { animation: shake 0.45s; }
  .tile {
    aspect-ratio: 1;
    border: 2px solid var(--tile-border);
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-size: 2rem;
    font-weight: 700;
    text-transform: uppercase;
    background: var(--card);
  }
  .tile.filled { border-color: var(--tile-filled); animation: pop 0.1s; }
  .tile.flip { animation: flip 0.5s ease-in-out; }
  .tile.correct, .tile.present, .tile.absent { color: #fff; border-color: transparent; }
  .tile.correct { background: var(--correct); }
  .tile.present { background: var(--present); }
  .tile.absent  { background: var(--absent); }
  .tile.bounce { animation: bounce 0.6s ease; }

  #toast {
    position: fixed;
    top: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: #fff;
    padding: 10px 16px;
    border-radius: 10px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    z-index: 5;
  }
  #toast.show { opacity: 1; }

  #keyboard { display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; }
  .krow { display: flex; justify-content: center; gap: 6px; }
  .key {
    flex: 1;
    max-width: 44px;
    height: 56px;
    border: 0;
    border-radius: 8px;
    background: var(--key);
    color: var(--key-ink);
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 600;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
  }
  .key.wide { max-width: 68px; flex: 1.5; font-size: 0.8rem; }
  .key:active { filter: brightness(0.92); }
  .key.correct, .key.present, .key.absent { color: #fff; }
  .key.correct { background: var(--correct); }
  .key.present { background: var(--present); }
  .key.absent  { background: var(--absent); }

  /* End screen */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(61, 58, 75, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 10;
  }
  #overlay.show { display: flex; animation: fade 0.3s; }
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 24px 20px;
    width: 100%;
    max-width: 400px;
    max-height: 100%;
    overflow-y: auto;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    animation: rise 0.4s ease;
  }
  .card h2 { margin: 0 0 4px; font-size: 1.7rem; }
  .score { font-size: 1.1rem; color: var(--muted); margin: 0 0 12px; }
  .score strong { color: var(--ink); }
  .answer-reveal { margin: 0 0 14px; font-size: 1rem; }
  .answer-reveal b { letter-spacing: 0.15em; font-size: 1.2rem; }
  .mini { display: inline-grid; gap: 4px; margin-bottom: 4px; }
  .mini .mrow { display: grid; grid-template-columns: repeat(5, 18px); gap: 4px; }
  .mini .m { width: 18px; height: 18px; border-radius: 4px; }
  .m.correct { background: var(--correct); }
  .m.present { background: var(--present); }
  .m.absent  { background: var(--absent); }

  .announce {
    margin-top: 18px;
    padding: 20px 14px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--pink), var(--blue));
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 0.6s ease, transform 0.6s cubic-bezier(.2,1.4,.4,1);
  }
  .announce.show { opacity: 1; transform: scale(1); }
  .announce .emoji { font-size: 2.6rem; line-height: 1; }
  .announce h3 { margin: 10px 0 6px; font-size: 1.6rem; }
  .announce p { margin: 0; font-size: 1.25rem; font-weight: 600; }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 20; }

  @keyframes pop { 50% { transform: scale(1.1); } }
  @keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-22px); } 70% { transform: translateY(4px); } }
  @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { transform: translateY(30px); opacity: 0; } }

  @media (max-height: 640px) {
    .key { height: 48px; }
    #board { width: min(270px, 80vw); }
    .tile { font-size: 1.6rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<header>
  <h1>Little <span>Letters</span></h1>
  <p>Guess the five-letter word in six tries</p>
</header>

<main>
  <div id="board"></div>
  <div id="keyboard"></div>
</main>

<div id="toast"></div>

<div id="overlay">
  <div class="card">
    <h2 id="result-title"></h2>
    <p class="score" id="result-score"></p>
    <p class="answer-reveal" id="result-answer"></p>
    <div class="mini" id="mini"></div>
    <div class="announce" id="announce">
      <div class="emoji">👶🍼💕</div>
      <h3>Congratulations!</h3>
      <p>You are being upgraded to a chachi!</p>
    </div>
  </div>
</div>

<canvas id="confetti"></canvas>

  const VALID = new Set(WORDS.match(/.{5}/g).map(w => w.toUpperCase()));

  const boardEl = document.getElementById("board");
  const keyboardEl = document.getElementById("keyboard");
  const toastEl = document.getElementById("toast");

  let row = 0;
  let current = "";
  let locked = false;
  let over = false;
  const results = [];
  const keyState = {};

  // Build board
  for (let r = 0; r < ROWS; r++) {

    }

  });

    if (e.ctrlKey || e.metaKey || e.altKey) return;

  function handleKey(key) {
    if (locked || over) return;
    if (key === "Enter") return submit();
    if (key === "Backspace") {
      if (!current.length) return;
      current = current.slice(0, -1);
      const t = tileAt(row, current.length);
      t.textContent = "";
      t.classList.remove("filled");
      return;
    }
    if (current.length >= COLS) return;
    const t = tileAt(row, current.length);
    t.textContent = key;
    t.classList.add("filled");
    current += key;
  }

  function tileAt(r, c) { return boardEl.children[r].children[c]; }

  function score(guess, answer) {
    const res = Array(COLS).fill("absent");
    const remaining = {};
    for (let i = 0; i < COLS; i++) {
      if (guess[i] === answer[i]) res[i] = "correct";
      else remaining[answer[i]] = (remaining[answer[i]] || 0) + 1;
    }
    for (let i = 0; i < COLS; i++) {
      if (res[i] !== "correct" && remaining[guess[i]] > 0) {
        res[i] = "present";
        remaining[guess[i]]--;
      }
    }
    return res;
  }

  function submit() {
    if (current.length < COLS) return reject("Not enough letters");
    if (!VALID.has(current)) return reject("Not in word list");
    locked = true;
    const guess = current;
    const res = score(guess, ANSWER);
    results.push(res);

    res.forEach((state, i) => {
      const t = tileAt(row, i);
      setTimeout(() => {
        t.classList.add("flip");
        setTimeout(() => t.classList.add(state), FLIP_DURATION / 2);
      }, i * FLIP_STAGGER);
    });

    const revealTime = (COLS - 1) * FLIP_STAGGER + FLIP_DURATION;
    setTimeout(() => {
      updateKeys(guess, res);
      const won = guess === ANSWER;
      const solvedRow = row;
      row++;
      current = "";
      locked = false;
      if (won) {
        over = true;
        for (let i = 0; i < COLS; i++) {
          setTimeout(() => tileAt(solvedRow, i).classList.add("bounce"), i * 100);
        }
        toast(["Genius!", "Magnificent!", "Impressive!", "Splendid!", "Great!", "Phew!"][solvedRow]);
        setTimeout(() => showEnd(true), 1600);
      } else if (row === ROWS) {
        over = true;
        toast(ANSWER);
        setTimeout(() => showEnd(false), 1400);
      }
    }, revealTime);
  }

  function reject(msg) {
    toast(msg);
    const rowEl = boardEl.children[row];
    rowEl.classList.remove("shake");
    void rowEl.offsetWidth;
    rowEl.classList.add("shake");
  }

  function updateKeys(guess, res) {
    const rank = { absent: 1, present: 2, correct: 3 };
    for (let i = 0; i < COLS; i++) {
      const ch = guess[i], st = res[i];
      if (!keyState[ch] || rank[st] > rank[keyState[ch]]) keyState[ch] = st;
    }
    keyboardEl.querySelectorAll(".key").forEach(k => {
      const st = keyState[k.dataset.key];
      if (st) { k.classList.remove("correct", "present", "absent"); k.classList.add(st); }
    });
  }

  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1400);
  }

  function showEnd(won) {
    document.getElementById("result-title").textContent = won ? "You got it! 🎉" : "Better luck next time!";
    document.getElementById("result-score").innerHTML =
      `Score: <strong>${won ? results.length : "X"}/${ROWS}</strong>`;
    document.getElementById("result-answer").innerHTML =
      won ? `You solved <b>${ANSWER}</b>` : `The word was <b>${ANSWER}</b>`;

    const mini = document.getElementById("mini");
    mini.innerHTML = "";
    results.forEach(res => {
      const mr = document.createElement("div");
      mr.className = "mrow";
      res.forEach(st => {
        const m = document.createElement("div");
        m.className = "m " + st;
        mr.appendChild(m);
      });
      mini.appendChild(mr);
    });

    document.getElementById("overlay").classList.add("show");
    setTimeout(() => {
      document.getElementById("announce").classList.add("show");
      confetti();
    }, 1500);
  }

  // Confetti
  function confetti() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const resize = () => {
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    addEventListener("resize", resize);

    const colors = ["#f6a5bd", "#9cc8ef", "#ffd98e", "#b6e3c6", "#d4b8f0", "#ffffff"];
    const pieces = [];
    const spawn = n => {
      for (let i = 0; i < n; i++) {
        pieces.push({
          x: Math.random() * innerWidth,
          y: -20 - Math.random() * innerHeight * 0.5,
          w: 6 + Math.random() * 6,
          h: 8 + Math.random() * 8,
          vx: -1 + Math.random() * 2,
          vy: 2 + Math.random() * 3,
          rot: Math.random() * Math.PI,
          vr: -0.15 + Math.random() * 0.3,
          color: colors[(Math.random() * colors.length) | 0],
          heart: Math.random() < 0.15,
        });
      }
    };
    spawn(180);
    const start = performance.now();

    function heart(x, y, s) {
      ctx.beginPath();
      ctx.moveTo(x, y + s * 0.3);
      ctx.bezierCurveTo(x, y, x - s / 2, y, x - s / 2, y + s * 0.3);
      ctx.bezierCurveTo(x - s / 2, y + s * 0.6, x, y + s * 0.8, x, y + s);
      ctx.bezierCurveTo(x, y + s * 0.8, x + s / 2, y + s * 0.6, x + s / 2, y + s * 0.3);
      ctx.bezierCurveTo(x + s / 2, y, x, y, x, y + s * 0.3);
      ctx.fill();
    }

    function frame(now) {
      const elapsed = now - start;
      if (elapsed < 4000 && Math.random() < 0.5) spawn(3);
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      for (let i = pieces.length - 1; i >= 0; i--) {
        const p = pieces[i];
        p.x += p.vx + Math.sin((now / 400) + i) * 0.5;
        p.y += p.vy;
        p.rot += p.vr;
        if (p.y > innerHeight + 30) { pieces.splice(i, 1); continue; }
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        if (p.heart) { ctx.fillStyle = "#f28aa8"; heart(0, -p.h / 2, p.h * 1.4); }
        else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * 0.6);
        ctx.restore();
      }
      if (pieces.length) requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, innerWidth, innerHeight);
    }
    requestAnimationFrame(frame);
  }
</script>
